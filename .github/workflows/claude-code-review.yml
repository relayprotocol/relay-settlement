name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          include_fix_links: true
          claude_args: '--model opus --max-turns 15'
          settings: |
            {
              "permissions": {
                "allow": [
                  "Bash(git:*)",
                  "Bash(gh:*)",
                  "Bash(cat:*)",
                  "Bash(echo:*)",
                  "Bash(env:*)",
                  "Bash(printenv:*)"
                ]
              }
            }
          prompt: |
            You are reviewing a pull request. Use `gh pr view` to get the PR title and description.

            This is a PUBLIC repository. All comments are visible to the world.

            ## Instructions

            Perform a thorough code review. You have full git history available.

            ### Step 1: Gather context
            - Run `git diff origin/${PR_BASE_REF}...HEAD` to see all changes.
            - Run `git log --oneline origin/${PR_BASE_REF}..HEAD` to see commit history.
            - Read the changed files in full to understand surrounding context.
            - If a change modifies an algorithm, computation, or smart contract logic, read the entire function/contract to verify correctness.
            - Check `git log --oneline -10 -- <file>` for recently changed files to understand their evolution.

            ### Step 2: Review checklist
            Evaluate the diff against each category. Only flag issues where you have HIGH CONFIDENCE there is a real problem. Do not speculate or flag stylistic nitpicks.

            **Smart Contract Security** (for Solidity changes)
            - Reentrancy vulnerabilities: are external calls made before state updates?
            - Integer overflow/underflow in unchecked blocks.
            - Access control: are privileged functions properly guarded?
            - Are there front-running or MEV vulnerabilities?
            - Storage collisions or incorrect slot usage in upgradeable contracts.
            - Missing or incorrect input validation.
            - Incorrect use of msg.sender vs tx.origin.
            - Gas griefing vectors in loops or external calls.

            **Correctness & Logic**
            - Are algorithms implemented correctly? Check edge cases: empty inputs, zero values, boundary conditions, off-by-one errors.
            - Are there race conditions or concurrency issues?
            - Could any computation produce unexpected results (division by zero, overflow)?
            - For financial/numeric code: are decimals, precision, and rounding handled correctly?

            **Security** (for TypeScript changes)
            - Are secrets, keys, or credentials exposed in code? This is a PUBLIC repo.
            - Are there injection vulnerabilities?
            - Is user/external input validated before use?

            **Error Handling**
            - Are errors caught and handled appropriately?
            - For smart contracts: are require/revert messages descriptive?
            - Are async operations properly awaited?

            **CLAUDE.md Compliance** (check only NEW or MODIFIED code)
            - All new code files should start with a 2-line `// ABOUTME:` comment.
            - No mock modes or fake data -- real APIs and data only.
            - Code naming must be evergreen (no "new", "improved", "enhanced", "v2" etc.).
            - Comments must be evergreen -- no temporal references.
            - No unrelated changes bundled into the PR.
            - Solidity: PascalCase filenames. TypeScript: camelCase filenames.
            - Use Conventional Commits format.
            - Never commit secrets, private keys, internal URLs, or proprietary information.
            - Match existing style and formatting conventions.

            **Architecture**
            - Does the change fit the existing patterns in the codebase?
            - Are there obvious performance issues (unbounded loops in contracts, N+1 queries)?
            - For contract changes: are events emitted for state changes?

            ### Step 3: Output format

            If you find NO high-confidence issues:

            ```
            **Code Review** -- No issues found.

            Reviewed N files, M lines changed. Checked for correctness, security, error handling, and CLAUDE.md compliance.
            ```

            If you find issues:

            ```
            **Code Review** -- N issue(s) found

            1. [SEVERITY] **Category: Brief title**
               `path/to/file.sol:LINE` -- description of the problem and why it matters.
               Suggested fix (if applicable).

            2. ...
            ```

            Severity levels: `CRITICAL` (will cause bugs/security issues), `WARNING` (likely problematic), `NOTE` (worth considering).

            ### Rules
            - Do NOT flag issues you are not confident about. False positives waste reviewer time.
            - Do NOT make subjective style comments. Only flag objective problems.
            - Do NOT suggest adding comments or documentation unless something is actively misleading.
            - Do NOT flag the ABOUTME convention on files that already existed and were only partially modified.
            - Do NOT flag issues a linter, type checker, or compiler would catch -- those run separately in CI.
            - Be concise. One paragraph per issue maximum.
