name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude-review:
    uses: relayprotocol/agents-config/.github/workflows/reusable-code-review.yml@main
    with:
      max_turns: 30
      review_guidelines: |
        - This is a PUBLIC repo -- never flag anything that would require posting secrets, private keys, internal URLs, or proprietary information in the review comment.
        - New code files must start with a 2-line `// ABOUTME:` comment.
        - No mock modes or fake data -- real APIs and data only.
        - Code naming must be evergreen (no "new", "improved", "enhanced", "v2" etc.).
        - Comments must be evergreen -- no temporal references like "recently refactored".
        - Code comments must not be removed unless provably false.
        - No unrelated changes bundled into the PR.
        - Solidity: PascalCase filenames. TypeScript: camelCase filenames.
        - Use Conventional Commits format for commit messages.
        - Match existing style and formatting conventions.
        - Do NOT flag the ABOUTME convention on files that already existed and were only partially modified.
        - Solidity security (apply to ALL touched Solidity code, not just new code):
          - Reentrancy: external calls must happen after state updates (checks-effects-interactions).
          - Access control: privileged functions must be properly guarded.
          - Integer overflow/underflow inside `unchecked` blocks.
          - Storage collisions or incorrect slot usage in upgradeable contracts.
          - Missing or incorrect input validation on external/public functions.
          - Incorrect use of `msg.sender` vs `tx.origin`.
          - Gas griefing vectors in loops or external calls.
          - Events emitted for all state changes; descriptive `require`/`revert` messages.
          - Front-running / MEV vulnerabilities in user-facing flows.
    secrets: inherit
