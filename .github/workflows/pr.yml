name: Pull Request

on:
  pull_request:

jobs:
  run-tests:
    name: 'Run the tests'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        folders: ['smart-contracts', '@relay-protocol/hub-client']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v45
        with:
          files: |
            ${{ matrix.folders }}/**

      - uses: actions/setup-node@v4
        if: steps.changed-files.outputs.any_modified == 'true'
        with:
          node-version: 22

      - run: yarn
        if: steps.changed-files.outputs.any_modified == 'true'
        shell: bash

      - run: 'yarn build'
        if: steps.changed-files.outputs.any_modified == 'true'
        shell: bash

      - name: 'run lint'
        run: yarn workspace @relay-protocol/${{matrix.folders}} lint
        if: steps.changed-files.outputs.any_modified == 'true'
        shell: bash

      - name: 'run tests'
        run: yarn workspace @relay-protocol/${{matrix.folders}} run test
        if: steps.changed-files.outputs.any_modified == 'true'
        shell: bash

      - name: 'run coverage'
        run: yarn workspace @relay-protocol/${{matrix.folders}} run coverage
        if: steps.changed-files.outputs.any_modified == 'true' && matrix.folders == 'smart-contracts'
        shell: bash

      - name: 'Upload coverage report'
        uses: actions/upload-artifact@v4
        if: steps.changed-files.outputs.any_modified == 'true' && matrix.folders == 'smart-contracts'
        with:
          name: coverage-report
          path: ${{ matrix.folders }}/coverage/
          retention-days: 7
