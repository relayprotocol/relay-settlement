name: Indexer Image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/indexer-image.yml"
      - ".yarn/**"
      - ".yarnrc.yml"
      - "package.json"
      - "yarn.lock"
      - "packages/abis/**"
      - "packages/indexer/**"
      - "packages/networks/**"
      - "packages/sdk/**"
      - "packages/tsconfig/**"
      - "smart-contracts/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/indexer-image.yml"
      - ".yarn/**"
      - ".yarnrc.yml"
      - "package.json"
      - "yarn.lock"
      - "packages/abis/**"
      - "packages/indexer/**"
      - "packages/networks/**"
      - "packages/sdk/**"
      - "packages/tsconfig/**"
      - "smart-contracts/**"

permissions:
  contents: read
  packages: write

jobs:
  build-indexer-image:
    name: Build indexer image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/indexer/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/relayprotocol/settlement-protocol:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
