name: Continuous Delivery settlement indexer

on:
  push:
    branches:
      - main
      - dev
    paths:
      - ".github/workflows/indexer-image.yml"
      - ".dockerignore"
      - ".yarn/**"
      - ".yarnrc.yml"
      - "package.json"
      - "yarn.lock"
      - "packages/indexer/**"
      - "packages/networks/**"
      - "packages/sdk/**"
      - "packages/tsconfig/**"
      - "smart-contracts/**"

env:
  NODE_VERSION: "24.12.0"
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./packages/indexer/Dockerfile
          push: true
          tags: |
            ghcr.io/unevenlabs/settlement-protocol:latest
            ghcr.io/unevenlabs/settlement-protocol:${{ github.sha }}
            ghcr.io/unevenlabs/settlement-protocol:${{ github.ref_name }}-${{ github.sha }}
          build-args: |
            TAG=${{ github.ref_name }}

  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    environment: dev
    if: github.ref == 'refs/heads/dev'
    steps:
      - name: Trigger deploy
        env:
          GH_TOKEN: ${{ secrets.DEVOPSBOT_TOKEN }}
          VERSION: ${{ github.sha }}
        run: |
          payload=$(printf '{"event_type":"deploy","client_payload":{"app":"settlement-indexer","version":"%s","environment":"dev","actor":"%s"}}' "$VERSION" "${{ github.actor }}")
          gh api repos/unevenlabs/k8s-configs/dispatches --method POST --input - <<< "$payload"

      - name: Summary
        if: always()
        run: |
          {
            if [ "${{ job.status }}" = "success" ]; then
              echo "### Deploy ✅"
            else
              echo "### Deploy ❌"
            fi
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **App** | \`settlement-indexer\` |"
            echo "| **Version** | \`${{ github.sha }}\` |"
            echo "| **Environment** | \`dev\` |"
            echo "| **Triggered by** | @${{ github.actor }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    environment: prod
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger deploy
        env:
          GH_TOKEN: ${{ secrets.DEVOPSBOT_TOKEN }}
          VERSION: ${{ github.sha }}
        run: |
          payload=$(printf '{"event_type":"deploy","client_payload":{"app":"settlement-indexer","version":"%s","environment":"stag+prod","actor":"%s"}}' "$VERSION" "${{ github.actor }}")
          gh api repos/unevenlabs/k8s-configs/dispatches --method POST --input - <<< "$payload"

      - name: Summary
        if: always()
        run: |
          {
            if [ "${{ job.status }}" = "success" ]; then
              echo "### Deploy ✅"
            else
              echo "### Deploy ❌"
            fi
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **App** | \`settlement-indexer\` |"
            echo "| **Version** | \`${{ github.sha }}\` |"
            echo "| **Environment** | \`stag+prod\` |"
            echo "| **Triggered by** | @${{ github.actor }} |"
          } >> "$GITHUB_STEP_SUMMARY"
