name: Continuous Delivery settlement indexer UI

on:
  push:
    branches:
      - main
      - dev
    paths:
      - ".github/workflows/continuous-delivery-settlement-indexer-ui.yml"
      - ".dockerignore"
      - ".yarn/**"
      - ".yarnrc.yml"
      - "package.json"
      - "yarn.lock"
      - "packages/eslint-config/**"
      - "packages/indexer-ui/**"
      - "packages/tsconfig/**"

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    name: Build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: ./packages/indexer-ui/Dockerfile
          push: true
          tags: |
            ghcr.io/relayprotocol/settlement-indexer-ui:latest
            ghcr.io/relayprotocol/settlement-indexer-ui:${{ github.sha }}
            ghcr.io/relayprotocol/settlement-indexer-ui:${{ github.ref_name }}-${{ github.sha }}

  deploy-dev:
    name: Deploy to Development
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    needs: [build]
    environment: dev
    if: github.ref == 'refs/heads/dev'
    steps:
      - name: Trigger deploy
        env:
          GH_TOKEN: ${{ secrets.DEVOPSBOT_TOKEN }}
          VERSION: ${{ github.sha }}
        run: |
          payload=$(printf '{"event_type":"deploy","client_payload":{"app":"settlement-indexer-ui","version":"%s","environment":"dev","actor":"%s"}}' "$VERSION" "${{ github.actor }}")
          gh api repos/unevenlabs/k8s-configs/dispatches --method POST --input - <<< "$payload"

      - name: Summary
        if: always()
        run: |
          {
            if [ "${{ job.status }}" = "success" ]; then
              echo "### Deploy ✅"
            else
              echo "### Deploy ❌"
            fi
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **App** | \`settlement-indexer-ui\` |"
            echo "| **Version** | \`${{ github.sha }}\` |"
            echo "| **Environment** | \`dev\` |"
            echo "| **Triggered by** | @${{ github.actor }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-prod:
    name: Deploy to Production
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    needs: [build]
    environment: prod
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger deploy
        env:
          GH_TOKEN: ${{ secrets.DEVOPSBOT_TOKEN }}
          VERSION: ${{ github.sha }}
        run: |
          payload=$(printf '{"event_type":"deploy","client_payload":{"app":"settlement-indexer-ui","version":"%s","environment":"stag+prod","actor":"%s"}}' "$VERSION" "${{ github.actor }}")
          gh api repos/unevenlabs/k8s-configs/dispatches --method POST --input - <<< "$payload"

      - name: Summary
        if: always()
        run: |
          {
            if [ "${{ job.status }}" = "success" ]; then
              echo "### Deploy ✅"
            else
              echo "### Deploy ❌"
            fi
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **App** | \`settlement-indexer-ui\` |"
            echo "| **Version** | \`${{ github.sha }}\` |"
            echo "| **Environment** | \`stag+prod\` |"
            echo "| **Triggered by** | @${{ github.actor }} |"
          } >> "$GITHUB_STEP_SUMMARY"
