[package]
name = "oracle-rpc-demo"
description = "Thin eth_call JSON-RPC server that dispatches into the price oracle precompile via revm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
alloy-primitives = { workspace = true, features = ["serde"] }
alloy-sol-types = { workspace = true }
oracle-reth = { path = "../oracle-reth" }
price-oracle-precompile = { path = "../price-oracle-precompile" }
revm = { version = "40", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
