[workspace]
members = ["pyth-ingester", "chainlink-ingester", "redstone-ingester"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/relayprotocol/relay-settlement"
rust-version = "1.93"
version = "1.0.0"

[workspace.dependencies]
alloy-primitives = "1.6"
alloy-sol-types = "1.6"
anyhow = "1.0.102"
base64 = "0.22"
borsh = { version = "1", features = ["rc", "bytes"] }
bytes = "1"
dotenvy = "0.15"
futures-util = "0.3"
hex = { version = "0.4", features = ["std"] }
hmac = { version = "0.13", default-features = false }
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
opentelemetry = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
    "trace",
    "http-proto",
    "reqwest-blocking-client",
    "reqwest-rustls-webpki-roots",
] }
opentelemetry-sdk = { package = "opentelemetry_sdk", version = "0.32" }
parking_lot = "0.12"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = { version = "0.11.0", default-features = false }
tempfile = "3.27"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tracing = { version = "0.1.44", default-features = false, features = ["attributes"] }
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

price-oracle-ipc = { git = "https://github.com/unevenlabs/relay-chain", rev = "a7541d22bec8d10595a8d0cac362c48171cc4460" }
