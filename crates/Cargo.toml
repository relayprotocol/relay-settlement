[workspace]
members = [
    "stork-ingester",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/relayprotocol/relay-settlement"
rust-version = "1.97"
version = "1.0.0"

[workspace.dependencies]
alloy = { version = "2.4.1", default-features = false }
alloy-json-abi = "1.6"
alloy-primitives = "1.6"
alloy-sol-macro-expander = "1.6"
alloy-sol-macro-input = "1.6"
alloy-sol-types = "1.6"
anchor-lang = "1.2.0"
anyhow = "1.0.102"
aws-config = { version = "1.12", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-credential-types = "1.3"
aws-sigv4 = "1.5.1"
axum = "0.8.9"
base64 = "0.22"
bincode = "1.3"
borsh = { version = "1", features = ["rc", "bytes"] }
bytes = "1"
chrono = "0.4"
config = { version = "0.15.25", default-features = false, features = ["toml"] }
contracts-evm = { path = "contracts-evm" }
contracts-svm = { path = "contracts-svm" }
dotenvy = "0.15"
futures-util = "0.3"
hex = { version = "0.4", features = ["std"] }
hmac = { version = "0.13", default-features = false }
httpdate = "1"
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
opentelemetry = "0.32"
opentelemetry-appender-tracing = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
    "trace",
    "metrics",
    "logs",
    "http-proto",
    "reqwest-blocking-client",
    "reqwest-rustls-webpki-roots",
] }
opentelemetry-sdk = { package = "opentelemetry_sdk", version = "0.32" }
parking_lot = "0.12"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
reqwest-middleware = "0.5.2"
reqwest-retry = "0.9.1"
reqwest-tracing = "0.7.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = { version = "0.11.0", default-features = false }
solana-signature = "3.4.1"
spl-associated-token-account-interface = "2.0"
spl-token-2022-interface = "3.1"
sqlx = { version = "0.9", default-features = false }
strum = "0.28"
subtle = "2.6"
tempfile = "3.27"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tower = "0.5.3"
tower-http = "0.7.1"
tracing = { version = "0.1.44", default-features = false, features = ["attributes"] }
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
utoipa = "5.5"
utoipa-swagger-ui = "9.0.2"
validator = "0.21"

price-oracle-ipc = { git = "https://github.com/unevenlabs/relay-chain", rev = "4f2013baf38c0feeb8abd7318994a013e5831b77" }
