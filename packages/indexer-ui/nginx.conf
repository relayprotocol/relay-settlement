server {
  listen 3000;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types application/javascript application/json image/svg+xml text/css text/plain;

  location = /health {
    access_log off;
    default_type application/json;
    return 200 '{"ok":true,"version":"${IMAGE_TAG}"}';
  }

  location /api/ {
    proxy_pass ${INDEXER_API_URL};
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header x-api-key "${AUTH_API_KEY}";
    proxy_ssl_server_name on;
    proxy_ssl_name $proxy_host;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /chain-icons/ {
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
