# ABOUTME: Foundry configuration for Solidity builds, tests, coverage, and scripts.
# ABOUTME: Pins compiler settings and dependency remappings for reproducible output.

[profile.default]
src = "contracts"
script = "script"
out = "out"
libs = ["node_modules", "dependencies"]
auto_detect_remappings = false
# Auto-deploy and link external libraries (e.g. AuroraSdk) used by contracts
# under test, so test contracts can `new` them directly without manual
# library linking.
dynamic_test_linking = true
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false

# Cross-chain deterministic deploys (MulticallRouter): pinning the lowest common
# denominator EVM version keeps the initcode, hence the CREATE2 address, identical.
[profile.london]
evm_version = "london"

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 256
depth = 15

# Preserve the exact dependency commits used before the Soldeer migration.
[dependencies]
forge-std = { version = "1.10.0", git = "https://github.com/foundry-rs/forge-std", rev = "8bbcf6e3f8f62f419e5429a0bd89331c85c37824" }

[soldeer]
remappings_generate = false
recursive_deps = false
