[package]
name = "relay-gateway-depository-fuzz"
version = "0.1.0"
description = "LiteSVM property tests for the relay gateway depository"
edition = "2021"
publish = false

# Standalone: keeps host-only dependencies out of the program workspace lockfile
[workspace]

[dependencies]
base64 = "0.22"
k256 = "0.13"
litesvm = { version = "0.18.2", features = ["precompiles"] }
proptest = "1.12"
serde_json = "1.0"
sha2 = "0.10"
sha3 = "0.10"
solana-account = "4.3"
solana-clock = "3.2"
solana-address = { version = "2.7", features = ["curve25519"] }
solana-instruction = "3.5"
solana-keypair = "3.1"
solana-signer = "3.0"
solana-transaction = "4.1"
