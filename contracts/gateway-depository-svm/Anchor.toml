[toolchain]
anchor_version = "1.2.1"
solana_version = "4.3.2"

[features]
resolution = true
skip-lint = false

[programs.localnet]
relay_gateway_depository = "DAt1pZmsCkKJ3WETGZPrtLhZq9inV3DrBSeZu12EKSe8"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/*.ts"

# Test-only router stand-in, built with `yarn build:fixtures` in ../depository-svm
[[test.genesis]]
address = "3516fiQYXRSj3wmyaQ3UcxoQMxGpbFUCecDjCmaUZEp9"
program = "../depository-svm/tests/fixtures/routed-transfer-caller/target/deploy/routed_transfer_caller.so"

