[toolchain]
anchor_version = "1.2.1"
solana_version = "4.3.2"

[features]
resolution = true
skip-lint = false

[programs.localnet]
relay_router = "9QybjuydfDYwJkdDLMJJaHEcQPaYeRoiJ5cYj7qLd5Su"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[[test.genesis]]
address = "99vQwtBwYtrqqD9YSXbdum3KBdxPAVxYTaQ3cfnJSrN2"
program = "../depository-svm/target/deploy/relay_depository.so"

