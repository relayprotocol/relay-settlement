# ABOUTME: Foundry config matching Hardhat's solc settings.
# ABOUTME: Provides remappings so Hardhat (via hardhat-foundry) can compile sources,
# ABOUTME: and configures forge build/test/coverage plus the deploy scripts under script/.
[profile.default]
src = "contracts"
script = "script"
out = "forge-out"
libs = ["node_modules", "lib"]
auto_detect_remappings = false
# Auto-deploy and link external libraries (e.g. Utils) used by contracts
# under test, so test contracts can `new` them directly without manual
# library linking.
dynamic_test_linking = true
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 256
depth = 15

# Etherscan v2 multi-chain key. forge resolves `${ETHERSCAN_API_KEY}` from the
# environment at runtime; per-chain keys can still be supplied via the
# `--etherscan-api-key` flag for non-v2 explorers.
[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}" }
