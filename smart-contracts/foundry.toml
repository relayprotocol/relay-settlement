# ABOUTME: Foundry config matching Hardhat's solc settings.
# ABOUTME: Provides remappings so Hardhat (via hardhat-foundry) can compile sources,
# ABOUTME: and configures forge build/test/coverage for an eventual Foundry test suite.
[profile.default]
src = "contracts"
test = "test-foundry"
out = "forge-out"
libs = ["node_modules", "lib"]
auto_detect_remappings = false
# Auto-deploy and link external libraries (e.g. Utils) used by contracts
# under test, so test contracts can `new` them directly without manual
# library linking.
dynamic_test_linking = true
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 256
depth = 15
